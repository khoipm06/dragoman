[package]
name = "dragoman"
version = "0.1.0"
edition = "2024"
authors = ["Khoi Pham Minh <khoipm06@gmail.com>"]
description = "High-performance OpenAI-compatible proxy for Gemini Web (Gemini 4 Argon)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/khoipm06/dragoman"
keywords = ["gemini", "gemini-4-argon", "openai-proxy", "llm", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
